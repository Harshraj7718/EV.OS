[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008 (function call in default arg) is the required FastAPI Depends()
# idiom, not a bug — the framework introspects call defaults for DI.
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
exclude = ["alembic/versions"]
